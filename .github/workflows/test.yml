name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: shivammathur/setup-php@afefcaf556d98dc7896cca380e181decb609ca44
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- js/
      - run: find lib appinfo templates tests -name '*.php' -exec php -l {} \;
      - run: php tests/backend.php
